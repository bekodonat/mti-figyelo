name: Hírfigyelő és Google Sheet Szinkronizáció

on:
  schedule:
    # Nappal (05:00 - 22:00 UTC, azaz 06:00 - 23:00 magyar idő szerint) félóránként (12 és 42 perckor)
    - cron: '12,42 5-22 * * *'
    # Éjszaka (23:00 - 04:00 UTC, azaz 00:00 - 05:00 magyar idő szerint) óránként (25 perckor)
    - cron: '25 23,0-4 * * *'
  workflow_dispatch: # Kézi indítás lehetősége a GitHub webes felületéről

permissions:
  contents: write

jobs:
  run-news-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Kód letöltése (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.12 beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'hirfigyelo/requirements.txt'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          pip install -r hirfigyelo/requirements.txt

      - name: Pipeline futtatása (Scraping + Matching + Google Sheet Sync)
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL || 'https://script.google.com/macros/s/AKfycbyPh-puqT2HKgpGSmttleFhlLlRGVxdNQOE-FdrFJubiA-WbKJC2Vtiy2SVrw77YzeU/exec' }}
        run: |
          cd hirfigyelo
          python run_pipeline.py

      - name: Adatbázis mentése a GitHub repóba (Git Scraping)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hirfigyelo/data/news_database.db
          if git diff --staged --quiet; then
            echo "Nincs új adat mentésre."
          else
            git commit -m "Auto: Óránkénti hírfrissítés és adatbázis mentés [skip ci]"
            git push
          fi
